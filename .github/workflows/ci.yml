name: ci

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          pip install -r requirements.txt bandit
          pip install --target pydeps -r requirements.txt

      - name: sast
        run: bandit -r .

      - name: auth
        run: python -m unittest test_security.py

      - name: sca
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: lab1
          path: pydeps
          format: HTML
          out: reports

      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: reports
