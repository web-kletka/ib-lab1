name: ci

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install -r requirements.txt bandit

      - name: sast
        run: bandit -r .

      - name: auth
        run: python -m unittest test_security.py

      - name: sca
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
